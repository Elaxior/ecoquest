<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quests - EcoQuest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#22c55e',
                        'primary-dark': '#16a34a',
                        secondary: '#3b82f6',
                        accent: '#f59e0b',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-inter bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex justify-between items-center h-16">
                <a href="dashboard.html" class="text-xl font-bold text-primary flex items-center">
                    <span class="text-2xl mr-2">🌱</span>
                    EcoQuest
                </a>
                
                <!-- Desktop Navigation -->
                <ul class="hidden md:flex space-x-8 items-center">
                    <li><a href="dashboard.html" class="text-gray-700 hover:text-primary font-medium transition-colors">Dashboard</a></li>
                    <li><a href="quests.html" class="text-gray-900 font-medium">Quests</a></li>
                    <li><a href="leaderboard.html" class="text-gray-700 hover:text-primary font-medium transition-colors">Leaderboard</a></li>
                    <li><a href="profile.html" class="text-gray-700 hover:text-primary font-medium transition-colors">Profile</a></li>
                    <li><button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-all font-medium">Logout</button></li>
                </ul>
                
                <!-- Mobile menu button -->
                <button class="md:hidden text-gray-700 p-2" id="mobileMenuBtn">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </nav>
            
            <!-- Mobile Navigation Menu -->
            <div id="mobileMenu" class="hidden md:hidden border-t border-gray-200 bg-white">
                <div class="px-2 pt-2 pb-3 space-y-1">
                    <a href="dashboard.html" class="block px-3 py-2 text-gray-700 hover:text-primary font-medium">Dashboard</a>
                    <a href="quests.html" class="block px-3 py-2 text-gray-900 font-medium">Quests</a>
                    <a href="leaderboard.html" class="block px-3 py-2 text-gray-700 hover:text-primary font-medium">Leaderboard</a>
                    <a href="profile.html" class="block px-3 py-2 text-gray-700 hover:text-primary font-medium">Profile</a>
                    <button id="logoutBtnMobile" class="block w-full text-left px-3 py-2 bg-red-500 text-white font-medium rounded-lg mx-3 mb-3 hover:bg-red-600 transition-all">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Quests Content -->
    <div class="pt-16 min-h-screen">
        <!-- Quest Header -->
        <div class="bg-gradient-to-r from-primary to-secondary text-white py-12">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <h1 class="text-4xl font-bold mb-4">Environmental Quests</h1>
                <p class="text-lg opacity-90 mb-6">Explore interactive missions tailored for your region and earn XP while making a real environmental impact!</p>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Search and Filters -->
            <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <input type="text" id="questSearch" placeholder="Search quests..." 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <select id="categoryFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">All Categories</option>
                        <option value="water-conservation">Water Conservation</option>
                        <option value="waste-management">Waste Management</option>
                        <option value="energy-saving">Energy Conservation</option>
                    </select>
                    <select id="difficultyFilter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">All Levels</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
            </div>

            <!-- Quest Grid -->
            <div id="questGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                <!-- Quest cards will be loaded here by JavaScript -->
            </div>
            
            <div id="loadingQuests" class="text-center py-12">
                <div class="animate-spin w-8 h-8 border-4 border-primary border-t-transparent rounded-full mx-auto mb-4"></div>
                <p class="text-gray-600">Loading environmental quests...</p>
            </div>
        </div>
    </div>

    <script src="/js/mobile-menu.js"></script>
    <script type="module" src="/js/auth/auth-guard.js"></script>
    <script type="module" src="/js/quests/quest-browser.js"></script>
</body>
</html>
