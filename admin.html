<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EcoQuest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#22c55e',
                        'primary-dark': '#16a34a',
                        secondary: '#3b82f6',
                        accent: '#f59e0b',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-inter bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <span class="text-2xl mr-2">🌱</span>
                    <h1 class="text-xl font-bold text-primary">EcoQuest Admin</h1>
                </div>
                <div class="flex items-center gap-4">
                    <span id="adminUser" class="text-sm text-gray-600">Loading...</span>
                    <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-all">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Admin Dashboard -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-blue-100 rounded-lg">
                        <span class="text-2xl">📝</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">Pending Review</p>
                        <p id="pendingCount" class="text-2xl font-bold text-blue-600">0</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-green-100 rounded-lg">
                        <span class="text-2xl">✅</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">Approved</p>
                        <p id="approvedCount" class="text-2xl font-bold text-green-600">0</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-purple-100 rounded-lg">
                        <span class="text-2xl">🎯</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">Total Quests</p>
                        <p id="totalQuests" class="text-2xl font-bold text-purple-600">0</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <div class="flex items-center">
                    <div class="p-2 bg-orange-100 rounded-lg">
                        <span class="text-2xl">👥</span>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-600">Active Users</p>
                        <p id="activeUsers" class="text-2xl font-bold text-orange-600">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Content Generation Panel -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
            <h2 class="text-xl font-bold text-gray-900 mb-6">🤖 AI Content Generation</h2>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Single Quest Generation -->
                <div class="border border-gray-200 rounded-lg p-4">
                    <h3 class="font-semibold text-gray-900 mb-4">Generate Single Quest</h3>
                    <div class="space-y-4">
                        <select id="singleCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="water-conservation">Water Conservation</option>
                            <option value="waste-management">Waste Management</option>
                            <option value="energy-saving">Energy Conservation</option>
                            <option value="biodiversity">Biodiversity</option>
                            <option value="air-quality">Air Quality</option>
                        </select>
                        
                        <select id="singleDifficulty" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                        
                        <select id="singleState" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="Delhi">Delhi</option>
                            <option value="Maharashtra">Maharashtra</option>
                            <option value="Karnataka">Karnataka</option>
                            <option value="Tamil Nadu">Tamil Nadu</option>
                            <option value="Rajasthan">Rajasthan</option>
                        </select>
                        
                        <select id="singleGrade" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="8">Grade 8</option>
                            <option value="9">Grade 9</option>
                            <option value="10">Grade 10</option>
                        </select>
                        
                        <button id="generateSingleBtn" class="w-full bg-primary text-white py-2 rounded-lg hover:bg-primary-dark transition-all">
                            Generate Quest
                        </button>
                    </div>
                </div>

                <!-- Batch Generation -->
                <div class="border border-gray-200 rounded-lg p-4">
                    <h3 class="font-semibold text-gray-900 mb-4">Batch Generation</h3>
                    <div class="space-y-4">
                        <label class="flex items-center">
                            <input type="checkbox" value="water-conservation" class="batch-category mr-2">
                            <span>Water Conservation</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="waste-management" class="batch-category mr-2">
                            <span>Waste Management</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="energy-saving" class="batch-category mr-2">
                            <span>Energy Conservation</span>
                        </label>
                        
                        <button id="generateBatchBtn" class="w-full bg-secondary text-white py-2 rounded-lg hover:bg-blue-600 transition-all">
                            Generate Batch (Selected Categories)
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="generationStatus" class="mt-4 p-4 bg-gray-50 rounded-lg hidden">
                <div class="flex items-center">
                    <div class="animate-spin w-5 h-5 border-2 border-primary border-t-transparent rounded-full mr-3"></div>
                    <span>Generating content using AI...</span>
                </div>
            </div>
        </div>

        <!-- Pending Review Quests -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-900">📋 Pending Review</h2>
                <button id="refreshBtn" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-all">
                    Refresh
                </button>
            </div>
            
            <div id="pendingQuests" class="space-y-4">
                <!-- Pending quests will be loaded here -->
            </div>
            
            <div id="noPending" class="text-center py-8 text-gray-500 hidden">
                <div class="text-4xl mb-4">✅</div>
                <p>No quests pending review!</p>
            </div>
        </div>
    </div>

    <!-- Quest Review Modal -->
    <div id="reviewModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <h3 class="text-xl font-bold text-gray-900">Review Quest</h3>
                    <button id="closeModal" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                
                <div id="questReviewContent">
                    <!-- Quest content will be loaded here -->
                </div>
                
                <div class="flex justify-end gap-4 mt-6 pt-6 border-t border-gray-200">
                    <button id="rejectBtn" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition-all">
                        Reject
                    </button>
                    <button id="approveBtn" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 transition-all">
                        Approve & Publish
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/admin/content-manager.js"></script>
</body>
</html>
